name: Platform checks

on:
  schedule:
    # Nightly at 02:23 Asia/Bangkok (19:23 UTC).
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to validate (blank uses the selected branch)'
        required: false
        type: string
      nightly:
        description: 'Build nightly installers; publish a prerelease when running on main'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      nightly: ${{ steps.build.outputs.nightly }}
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Pin source and nightly identity
        id: build
        shell: bash
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
          stamp="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=1.0.0-nightly.$stamp" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$stamp" >> "$GITHUB_OUTPUT"

  check:
    name: Checks and packages (${{ matrix.platform }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      AVDBUDDY_TEST_INSTALLED_SDK: 'true'
      NUCLEUS_PUBLISH_MODE: never
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.nightly == 'true'
        with:
          node-version: '22'
      - name: Install Linux emulator and packaging runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libasound2t64 libglu1-mesa libfuse2t64
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: false
      - name: Check nightly artifact safeguards
        run: python -m unittest discover -s scripts/tests
      - name: Build and run headless checks
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon --console=plain test --rerun check assemble platformDiagnostics
      - name: Build and run headless checks (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon --console=plain test --rerun check assemble platformDiagnostics
      - name: Package nightly installers
        if: needs.prepare.outputs.nightly == 'true' && runner.os != 'Windows'
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./gradlew --no-daemon --console=plain -PnightlyBuild=true -PnightlyBuildNumber=$GITHUB_RUN_NUMBER -PnightlyVersion="$NIGHTLY_VERSION" packageDistributionForCurrentOS
      - name: Package nightly installers (Windows)
        if: needs.prepare.outputs.nightly == 'true' && runner.os == 'Windows'
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: .\gradlew.bat --no-daemon --console=plain -PnightlyBuild=true "-PnightlyBuildNumber=$env:GITHUB_RUN_NUMBER" "-PnightlyVersion=$env:NIGHTLY_VERSION" packageDistributionForCurrentOS
      - name: Verify packaged runtime headlessly and collect installers
        if: needs.prepare.outputs.nightly == 'true'
        run: |
          python scripts/nightly.py verify build/compose/binaries/main/app
          python scripts/nightly.py collect build/compose/binaries/main ${{ matrix.platform }} build/nightly-artifacts
      - name: Upload nightly installers
        if: needs.prepare.outputs.nightly == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/nightly-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and packaging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/compose/logs/
          if-no-files-found: warn

  publish-nightly:
    name: Publish nightly prerelease
    needs: [prepare, check]
    if: needs.prepare.outputs.nightly == 'true' && github.ref == 'refs/heads/main' && (inputs.ref == '' || inputs.ref == 'main' || inputs.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          merge-multiple: true
          path: build/nightly-release
      - name: Publish installers without stable update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python scripts/nightly.py publish build/nightly-release "$NIGHTLY_TAG" "$SOURCE_SHA" "$GITHUB_REPOSITORY"
