syntax = "proto3";
package android.emulation.control;
option java_package = "com.avdbuddy.emulator.protocol";
option java_multiple_files = true;

message Touch {
  int32 x = 1;
  int32 y = 2;
  int32 identifier = 3;
  int32 pressure = 4;
}

message TouchEvent {
  repeated Touch touches = 1;
  int32 display = 2;
}

message ImageFormat {
  enum ImgFormat { PNG = 0; RGBA8888 = 1; RGB888 = 2; }
  ImgFormat format = 1;
  uint32 width = 3;
  uint32 height = 4;
  uint32 display = 5;
}

message Image {
  ImageFormat format = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestamp_us = 6;
}
